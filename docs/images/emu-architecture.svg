<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">EMU: one robot, one shared brain, many physical lessons</title>
<desc id="desc">Illustration of EMU receiving simulated sensor readings, learning through a neural policy, controlling six servos in a MuJoCo world, and improving through a curriculum of six types of lessons.</desc>
