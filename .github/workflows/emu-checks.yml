name: EMU source and browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede stale PR checks; one practical physics check is enough.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Syntax, current 360 actor and CLI contract
        run: |
          # A new, package-free CPU-only WSL installation must be able to
          # parse and serve the sensor lab, without importing NumPy/JAX.
          python -S -m emu.cli viewer-build --help >/dev/null
          python -S -m emu.cli viewer --sensor-lab --help >/dev/null
          python -S - <<'PY'
          import json
          from emu.viewer_server import make_sensor_lab_bundle
          b = json.loads(make_sensor_lab_bundle())
          assert b['sensor_lab'] is True
          assert 'h40' in b['robot_xml']
          assert b['source']['actor_sha256'] == 'not-applicable-sensor-lab'
          print('DEPENDENCY-FREE h40 LAB STARTUP: PASS')
          PY
          python -m compileall -q emu scripts tests
          # Main carries one real H40 inference actor. Validate its full
          # observation contract independently of manual Pages approval.
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.verify_showcase_release import validate_browser_bundle
          actor = Path('showcase/champion.emupolicy')
          info = validate_browser_bundle(json.loads(actor.read_text(encoding='utf-8')))
          assert info['step'] > 0 and info['obs_dim'] == 360
          print(f"H40 POLICY CONTRACT PASS: {info['step']:,} steps")
          PY
          # The release approval remains a separate explicit manual gate.
          if test -f showcase/release_approval.json; then
            python scripts/verify_showcase_release.py
          fi
          if ! python scripts/audit_core_dependencies.py --json > /tmp/emu-core-inventory.json; then
            python -c 'import json; j=json.load(open("/tmp/emu-core-inventory.json")); print("OWNERSHIP:",j["ownership_errors"]); print("IMPORTS:",j["missing_emu_module_imports"]); print("BAD DOC LINKS:",j["broken_markdown_links"]); print("DOC POLICY:",j["documentation_policy"])'
            exit 1
          fi
          emu doctor --no-require-gpu --no-mjx-smoke
          python -m emu.cli train --help > /dev/null
          python -m emu.cli prism-exam --help > /dev/null
          # Experiment wrappers are intentionally retired in the active
          # main tree. Test the stable public CLI and physical contracts.
          test ! -e scripts/run_prism_140m.py
          test ! -e scripts/run_v5046_20m.py
          test ! -e scripts/v5048_shared_parent_tournament.py
          # Finished experiments belong in Git history, not active code.
          test ! -e scripts/v5051_fixed_wall_screen.py
          test ! -e scripts/v5051_train_campaign.py
          test ! -e scripts/v5052_step_school.py
          python -m pytest -q tests
      - name: Compile the h40 CPU sensor laboratory's eight genuine prism meshes
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          import mujoco
          from emu.viewer_server import sensor_lab_robot_xml

          js = ("import {createSensorLabCarpet,sensorLabPrismXml} "
                "from './emu/viewer_src/src/sensor-lab-carpet.js';"
                "console.log(JSON.stringify(sensorLabPrismXml("
                "createSensorLabCarpet({slopeDeg:0,stepUpM:0,stepDownM:0}))));")
          fixture = json.loads(subprocess.check_output(
              ['node', '--input-type=module', '-e', js], text=True))
          robot = sensor_lab_robot_xml()
          robot, floor_count = re.subn(
              r'<geom\s+name="floor"[^>]*\/>', '', robot)
          assert floor_count == 1
          robot = robot.replace('<worldbody>', '<asset>' + fixture['assets'] +
                                '</asset><worldbody>')
          robot = robot.replace('</worldbody>', fixture['bodies'] + '</worldbody>')
          model = mujoco.MjModel.from_xml_string(robot)
          # Exact trainer h40 source: no visual braces or knee motor cases.
          from emu.physical_variants import generate_xml, profile_numbers
          source = Path('emu/robot.xml').read_text(encoding='utf-8')
          assert sensor_lab_robot_xml() == generate_xml(source, 'h40')
          assert 'sensor_lab_hip_mount' not in robot
          assert 'knee_servo' not in robot
          # Eight kinematic terrain prisms have enormous compiled mesh
          # masses; those belong to the WORLD, not the ~506g robot. Only
          # count non-mocap physical bodies in this assertion.
          mass = float(model.body_mass[model.body_mocapid < 0].sum())
          assert .49 <= mass <= .52, mass
          assert abs(mass-float(profile_numbers('h40')['mass_kg']))<1e-4
          chassis=mujoco.mj_name2id(model,mujoco.mjtObj.mjOBJ_GEOM,'torso_box')
          assert abs(model.geom_pos[chassis,0]-.005)<1e-7
          assert model.geom_pos[chassis,0]-model.geom_size[chassis,0]<-.01
          for side in 'rl':
              assert mujoco.mj_name2id(
                  model,mujoco.mjtObj.mjOBJ_GEOM,side+'_thigh_rod_b')==-1
              gid=mujoco.mj_name2id(
                  model,mujoco.mjtObj.mjOBJ_GEOM,side+'_thigh_rod')
              assert model.geom_type[gid]==mujoco.mjtGeom.mjGEOM_BOX
          assert model.nu == 6
          assert sum(mujoco.mj_id2name(model, mujoco.mjtObj.mjOBJ_GEOM, i)
                     .startswith('sensor_lab_prism_')
                     for i in range(model.ngeom)) == 8
          data = mujoco.MjData(model)
          data.qpos[0] = data.qpos[1] = .5
          data.qpos[2] -= .002  # slight contact penetration, not a tangent rounding test
          mujoco.mj_forward(model, data)
          assert data.ncon >= 1, 'neutral h40 feet must contact real prism tops'
          print(f'h40 SENSOR LAB CPU PASS: {model.ngeom} geoms, {data.ncon} contacts')
          PY
      - name: DIAGNOSTIC compare trained H40 flat floor and Carpet real contact trajectories
        run: |
          python - <<'PY'
          import json, subprocess
          import mujoco
          import numpy as np
          print('H40_CARPET_DIAG_BEGIN',flush=True)
          code = r'''import fs from 'node:fs';
          import {withTerrain} from './emu/viewer_src/src/terrain.js';
          import {createSensorLabCarpet} from './emu/viewer_src/src/sensor-lab-carpet.js';
          const raw=JSON.parse(fs.readFileSync('./showcase/champion.emupolicy','utf8')).robot_xml;
          const out={flat: {xml:raw}};
          for(const deg of [0,2.5,10,15]){
            const surface=createSensorLabCarpet({slopeDeg:deg,stepUpM:.006,stepDownM:.008});
            out['carpet_'+deg]={xml:withTerrain(raw,'carpet',{park:surface}),tiles:surface.tiles};
          }
          process.stdout.write(JSON.stringify(out));'''
          scenes=json.loads(subprocess.check_output(['node','--input-type=module','-e',code],text=True))
          for name,scene in scenes.items():
            model=mujoco.MjModel.from_xml_string(scene['xml'])
            data=mujoco.MjData(model)
            if name!='flat':
              data.qpos[0]=data.qpos[1]=.5
            mujoco.mj_forward(model,data)
            footids=[mujoco.mj_name2id(model,mujoco.mjtObj.mjOBJ_GEOM,f'{side}_foot_ball') for side in 'rl']
            initial=[]
            for gid in footids:
              x,y,z=data.geom_xpos[gid];radius=model.geom_size[gid,0]
              if name=='flat': h=0; slope=0
              else:
                i,j=int(np.floor(x)),int(np.floor(y))
                tile=next(t for t in scene['tiles'] if t['i']==i and t['j']==j)
                a,b,c,d=tile['corners'];u=x-i;v=y-j
                h=a+(b-a)*u+(c-a)*v if u+v<=1 else d+(c-d)*(1-u)+(b-d)*(1-v)
                slope=np.tan(np.deg2rad(float(name.split('_')[1])))
              initial.append((gid,x,y,z,h,radius))
            if name!='flat':
              lift=max(h+r*np.hypot(1,slope)-z for _,x,y,z,h,r in initial)
              data.qpos[2]+=lift
              mujoco.mj_forward(model,data)
            else: lift=0
            print('SCENE',name,'model qpos0',list(np.round(model.qpos0[:3],4)),
                  'body initial',list(np.round(data.qpos[:3],4)),
                  'lift',round(lift,6),
                  'foot z/h',[(round(float(data.geom_xpos[g,2]),5),round(h,5)) for g,x,y,z,h,r in initial],
                  'init contacts',data.ncon,flush=True)
            data.ctrl[:]=0
            for frame in range(25):
              mujoco.mj_step(model,data)
              if frame in (0,1,4,9,24):
                contacts=[]
                for c in data.contact[:data.ncon]:
                  ga=mujoco.mj_id2name(model,mujoco.mjtObj.mjOBJ_GEOM,c.geom1)
                  gb=mujoco.mj_id2name(model,mujoco.mjtObj.mjOBJ_GEOM,c.geom2)
                  if 'foot_ball' in (ga or '')+(gb or ''):
                    contacts.append((ga,gb,round(float(c.dist),4)))
                print('  t',round((frame+1)*model.opt.timestep,3),
                      'z',round(float(data.qpos[2]),4),
                      'velZ',round(float(data.qvel[2]),4),
                      'ncon',data.ncon,'foot contacts',contacts[:4],flush=True)
          print('H40_CARPET_DIAG_END',flush=True)
          PY
      - name: Actual eight-prism CPU MJX contacts, sidewalls, mesh and robot
        run: timeout 540s python scripts/probe_carpet_prism_mjx.py --worlds 4 --frames 2

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Run current browser controls and physics-inspector checks
        run: npm test --prefix emu/viewer_src
      - name: Prepare approved Pages actor (only when reviewed)
        run: |
          if test -f showcase/release_approval.json; then
            python scripts/prepare_showcase.py \
              --policy showcase/champion.emupolicy \
              --source-url "https://github.com/$GITHUB_REPOSITORY" \
              --source-commit "$GITHUB_SHA"
          fi
      - name: Build browser
        run: npm run build --prefix emu/viewer_src
      - name: Verify approved Pages bundle (only when reviewed)
        run: |
          if test -f showcase/release_approval.json; then
            python scripts/verify_showcase_release.py \
              --verify-dist --expect-source-commit "$GITHUB_SHA"
          fi
      - name: Reject modifications to tracked source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      # The deleted experimental browser harness is not invoked here.
      # The six essential viewer contracts run above. Full manual
      # MuJoCo browser acceptance remains a release-review step.

