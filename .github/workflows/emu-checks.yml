name: EMU source and browser checks

on:
  pull_request:
    branches: [main, experiment/v5046-75cm-four-tile-midpoint, maintenance/v5046-prune-sweep-and-promotion-gates, experiment/v5047-pinnacle-stairs-gaits, experiment/v5048-shared-parent-pinnacle]
  push:
    branches: [main, experiment/v5046-75cm-four-tile-midpoint, release/v5049-main-promotion-prep]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede stale PR checks; one practical physics check is enough.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Syntax, public actor and CLI contract
        run: |
          python -m compileall -q emu scripts tests
          python scripts/verify_showcase_release.py
          if ! python scripts/audit_core_dependencies.py --json > /tmp/emu-core-inventory.json; then
            python -c 'import json; j=json.load(open("/tmp/emu-core-inventory.json")); print("OWNERSHIP:",j["ownership_errors"]); print("IMPORTS:",j["missing_emu_module_imports"]); print("BAD DOC LINKS:",j["broken_markdown_links"])'
            exit 1
          fi
          emu doctor --no-require-gpu --no-mjx-smoke
          python -m emu.cli train --help > /dev/null
          python -m emu.cli prism-exam --help > /dev/null
          # Experiment wrappers are intentionally retired in the future
          # main tree. Test the stable public CLI and physical contracts.
          test ! -e scripts/run_prism_140m.py
          test ! -e scripts/run_v5046_20m.py
          test ! -e scripts/v5048_shared_parent_tournament.py
          python -m pytest -q tests
      - name: Actual eight-prism CPU MJX contacts, sidewalls, mesh and robot
        run: timeout 540s python scripts/probe_carpet_prism_mjx.py --worlds 4 --frames 2
      - name: Real MuJoCo static supported-foot reach (not dynamic proof)
        run: timeout 90s python scripts/probe_stair_kinematics.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Run browser controls and packaging checks
        run: npm test --prefix emu/viewer_src
      - name: Prepare protected champion
        run: python3 scripts/prepare_showcase.py
      - name: Build browser
        run: npm run build --prefix emu/viewer_src
      - name: Reject modifications to tracked source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify policy and WASM assets
        run: python3 scripts/verify_showcase_release.py --verify-dist
      # The deleted experimental browser harness is not invoked here.
      # The six essential viewer contracts run above. Full manual
      # MuJoCo browser acceptance remains a release-review step.

