name: EMU source and browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede stale PR checks; one practical physics check is enough.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Syntax, public actor and CLI contract
        run: |
          python -m compileall -q emu scripts tests
          python scripts/verify_showcase_release.py
          emu doctor --no-require-gpu --no-mjx-smoke
          emu train --run-dir "$RUNNER_TEMP/academy-plan" --steps 120000000 --envs 2048 --seed 761 --device cuda --profile sim2real --terrain-actor --terrain-step-max-m .08 --unified-capabilities --academy-stream --terrain-lesson coherent-careful --plan > /dev/null
      - name: One actual streaming three-platform MJX + PPO update (CPU, no training)
        run: timeout 540s python scripts/smoke_step_course.py --device cpu --worlds 4 --frames 3 --ppo

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Run browser controls and packaging checks
        run: npm test --prefix emu/viewer_src
      - name: Prepare protected champion
        run: python3 scripts/prepare_showcase.py
      - name: Build browser
        run: npm run build --prefix emu/viewer_src
      - name: Reject modifications to tracked source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify policy and WASM assets
        run: python3 scripts/verify_showcase_dist.py
      # The deleted experimental browser harness is not invoked here.
      # The twelve maintained viewer contracts run above. Full manual
      # MuJoCo browser acceptance remains a release-review step.

