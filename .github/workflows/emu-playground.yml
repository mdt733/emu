name: EMU Playground (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emu-playground.yml'
      - '.nvmrc'
      - 'viewer/**'
      - 'showcase/**'
      - 'scripts/prepare_showcase.py'

permissions:
  contents: read

concurrency:
  group: github-pages-emu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and policy
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Prepare static policy and manifest
        env:
          REPO: ${{ github.repository }}
        run: python3 scripts/prepare_showcase.py --source-url "https://github.com/$REPO"
      - name: Install locked viewer dependencies
        run: npm ci --prefix viewer --no-audit --no-fund
      - name: Run JavaScript contract tests
        run: npm run test --prefix viewer
      - name: Build static MuJoCo viewer
        run: npm run build --prefix viewer
      - name: Verify bundled policy and WASM assets
        run: python3 scripts/verify_showcase_dist.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
