name: EMU Playground (GitHub Pages)

# Public deployment is intentionally MANUAL. Merging experimental Python or
# browser source to main must not silently replace the working 60M demo.
# The release custodian explicitly runs this workflow after a browser review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-emu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and policy
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Require the protected 60M showcase champion
        shell: bash
        run: |
          test -f showcase/champion.emupolicy
          ACTUAL="$(git hash-object showcase/champion.emupolicy)"
          EXPECTED="4743d8d3cd4706edce04809fe1b61df014e57d5e"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Champion has changed. Update release process deliberately; refusing accidental deployment." >&2
            exit 1
          fi
      - name: Prepare static policy and manifest
        env:
          REPO: ${{ github.repository }}
        run: python3 scripts/prepare_showcase.py --require-champion --source-url "https://github.com/$REPO"
      - name: Install locked viewer dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Run JavaScript contract tests
        run: npm run test --prefix emu/viewer_src
      - name: Build static MuJoCo viewer
        run: npm run build --prefix emu/viewer_src
      - name: Verify bundled policy and WASM assets
        run: python3 scripts/verify_showcase_dist.py
      - name: Reject viewer builds that modify tracked source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: emu/viewer_src/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
