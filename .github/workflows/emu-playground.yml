name: EMU Playground (GitHub Pages)

# Deploy only after an explicit trained-actor approval. The *previous*
# champion and all old deployment allowlists are available in Git history.
# Merely merging sources must never publish an untrained robot.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-emu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source and actor
        uses: actions/checkout@v4
      - name: Validate approved trained physical 360-input actor
        run: python3 scripts/verify_showcase_release.py
      - name: Prepare exactly the reviewed actor
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/prepare_showcase.py \
            --policy showcase/champion.emupolicy \
            --source-url "https://github.com/$REPO" \
            --source-commit "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Test browser contracts
        run: npm test --prefix emu/viewer_src
      - name: Build source-pinned viewer
        run: npm run build --prefix emu/viewer_src
      - name: Verify deployed bytes
        run: python3 scripts/verify_showcase_release.py --verify-dist --expect-source-commit "$GITHUB_SHA"
      - name: Reject modifications to source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: emu/viewer_src/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
