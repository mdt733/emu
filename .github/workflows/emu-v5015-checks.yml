name: EMU software checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop/playground-attitude-terrain, feature/v5016-sim2real]
  workflow_dispatch:

permissions:
  contents: read

# When multiple revisions arrive on the same draft PR, only test the newest.
# Avoid dozens of obsolete overlapping runs and failure notifications.
# Manual dispatch and separate PRs retain independent concurrency groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compile
        run: python -m compileall -q emu tests
      - name: Run 16 Python checks
        run: python -m pytest -q tests
      - name: Smoke public doctor CLI (CPU-only)
        run: emu doctor --no-require-gpu --no-mjx-smoke
      - name: Smoke public planning, exams and exporter imports
        run: |
          emu ladder --stage plan > /dev/null
          emu directional-exam --help > /dev/null
          emu directional-batch --help > /dev/null
          emu train --help > /dev/null
          emu train --run-dir "$RUNNER_TEMP/emu-plan-only" --steps 120000000 --envs 1024 --seed 733 --device cuda --profile mature --pitch-deg 15 --plan > /dev/null
          emu evaluate --help > /dev/null
          emu export-policy --help > /dev/null
          python - <<'PY'
          from emu.checkpoint_io import resume_training_lineage, git_provenance
          from emu.branch_lab import train_one, plan_dict
          from emu.evaluation import evaluate_runs, atlas_main, directional_main, batch_main
          from emu.viewer_server import build_bundle, field_main, LivePolicyWatcher
          print('All public entrypoint owners import cleanly')
          PY

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Run browser controls and packaging checks
        run: npm test --prefix emu/viewer_src
      - name: Prepare protected champion
        run: python3 scripts/prepare_showcase.py --require-champion
      - name: Build browser
        run: npm run build --prefix emu/viewer_src
      - name: Reject modifications to tracked source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify policy and WASM assets
        run: python3 scripts/verify_showcase_dist.py
