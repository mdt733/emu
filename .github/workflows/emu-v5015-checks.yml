name: EMU software checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop/playground-attitude-terrain]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compile
        run: python -m compileall -q emu tests
      - name: Run 16 Python checks
        run: python -m pytest -q tests

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Run 4 browser checks
        run: npm test --prefix emu/viewer_src
      - name: Prepare protected champion
        run: python3 scripts/prepare_showcase.py --require-champion
      - name: Build browser
        run: npm run build --prefix emu/viewer_src
      - name: Reject modifications to tracked source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify policy and WASM assets
        run: python3 scripts/verify_showcase_dist.py
