name: v5022 physical terrain spike

on:
  push:
    branches: [feature/v5022-forward-terrain]
  pull_request:
    branches: [main]
    paths:
      - emu/forward_sensing.py
      - emu/terrain_profiles.py
      - tests/test_v5022_*.py
      - .github/workflows/v5022-terrain-spike.yml

permissions:
  contents: read

concurrency:
  group: v5022-physical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-and-real-mjx:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install exact branch software dependencies
        run: python -m pip install -e ".[dev]"
      - name: Version and source identity
        run: |
          git log -1 --format='%H'
          python -c "import mujoco,jax; print('MuJoCo:',mujoco.__version__,'JAX:',jax.__version__)"
      - name: Consolidated terrain and optical geometry
        run: |
          python -m pytest -q tests/test_terrain.py -k 'not mjx'
      - name: Actual MJX solids, support and ray tracing
        run: |
          python -m pytest -q tests/test_terrain.py -k 'mjx'
      - name: Legacy contract shape regression
        run: |
          python -m pytest -q \
            tests/test_physics.py::test_versioned_sensor_actor_schema_keeps_pitch15_frozen \
            tests/test_physics.py::test_opt_in_232_actor_sees_noisy_tripod_and_optical_flow_mjx \
            tests/test_learning.py::test_sensor_checkpoint_requires_explicit_schema_and_matching_physical_contract
