name: One-time asset migration to Infinite Meadow
on:
  push:
    branches: [feature/h40-infinite-latitude-meadow-20261110]
permissions:
  contents: write
jobs:
  import-original-meadow-sky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h40-infinite-latitude-meadow-20261110
          persist-credentials: true
      - name: Vendor the original user-owned Meadow panorama without recompression
        run: |
          set -euo pipefail
          target=emu/viewer_src/src/assets/meadow-skybox.png
          if test -f "$target"; then
            echo "Original panorama already vendored"
            exit 0
          fi
          mkdir -p "$(dirname "$target")"
          curl -fLSs --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/mdt733/meadow/6a56516386883c820a8b5ae283101c7dd636728f/skybox.png \
            -o "$target"
          original_blob=9eaed55fcc9a9f86846336808d5ecae56b43097c
          test "$(git hash-object "$target")" = "$original_blob"
          test "$(wc -c < "$target")" -eq 2491081
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m "assets: vendor exact original Meadow skybox panorama (2.5 MB)"
          git push origin HEAD:feature/h40-infinite-latitude-meadow-20261110
