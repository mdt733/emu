name: v5044 140M real-prism run proof

on:
  push:
    branches:
      - feature/v5044-prism-140m-coldstart
  workflow_dispatch:

permissions:
  contents: read

# This experimental branch has one push run per SHA, not duplicate push+PR
# probes that race to cancel each other. A newer push replaces stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prism-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real physics / JAX
        run: python -m pip install -e ".[dev]"
      - name: Python syntax and deterministic terrain mathematical tests
        run: |
          python -m compileall -q emu scripts tests
          python -m pytest -q tests/test_terrain_carpet.py tests/test_carpet_sensor_geometry.py tests/test_carpet_visit_rewards.py tests/test_prism_exam_scorer.py tests/test_prism_grade_cap.py tests/test_prism_smoke_reporting.py tests/test_prism_140m_recipe.py
      - name: Actual 18 convex prism MJX riser, seam, EMU reset and step
        run: python scripts/probe_carpet_prism_mjx.py --worlds 4 --frames 2

      - name: 140M launch CLI plan (dry; no actual training)
        run: python scripts/run_prism_140m.py plan
