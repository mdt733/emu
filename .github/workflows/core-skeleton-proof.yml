name: v5045 Core skeleton and prism housekeeping

on:
  push:
    branches:
      - feature/v5045-core-skeleton-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install training and testing contracts
        run: python -m pip install -e ".[dev]"
      - name: Compile Python and generate static ownership inventory
        run: |
          python -m compileall -q emu scripts tests
          python scripts/check_current_docs.py
          python scripts/audit_core_dependencies.py --json > /tmp/emu-core-inventory.json
      - name: 18 essential Python contracts (no historical fixture suite)
        run: |
          python -m pytest -q tests
      - name: True four-world convex prism MJX contact and recycle probe
        run: python scripts/probe_carpet_prism_mjx.py --worlds 4 --frames 2

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locked browser dependencies
        working-directory: emu/viewer_src
        run: npm ci
      - name: Six essential browser contracts
        working-directory: emu/viewer_src
        run: npm test
      - name: Build MuJoCo/WASM browser viewer
        working-directory: emu/viewer_src
        run: npm run build
