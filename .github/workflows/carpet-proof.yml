name: v5041 Carpet viewer and collision checks
on:
  push:
    branches: [feature/v5041-unified-terrain-carpet]
  pull_request:
    paths:
      - 'emu/viewer_src/**'
      - 'emu/terrain_carpet.py'
      - 'emu/viewer_server.py'
      - 'scripts/probe_carpet_hfield.py'
      - 'scripts/terrain_snapshot.py'
      - 'tests/test_terrain_carpet.py'
      - '.github/workflows/carpet-proof.yml'
  workflow_dispatch:
jobs:
  physics-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install identical MuJoCo / MJX and Python tests
        run: |
          python -m pip install -e '.[dev]'
      - name: Python syntax and independent grid contract
        run: |
          python -m compileall -q emu scripts tests
          python -m pytest -q tests/test_terrain_carpet.py
          python -m pytest -q tests/test_carpet_physical_contacts.py
          python -m pytest -q tests/test_carpet_solid_geometry.py
          python -m pytest -q tests/test_carpet_sensor_geometry.py
          python -m pytest -q tests/test_carpet_visit_rewards.py
          python scripts/probe_carpet_hfield.py
          python scripts/smoke_gpu_carpet.py --worlds 4 --frames 2 --ppo
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emu/viewer_src/package-lock.json
      - name: Install locked viewer dependencies
        run: npm ci --prefix emu/viewer_src --no-audit --no-fund
      - name: Existing 3D viewer regression tests and Training Carpet tests
        run: npm test --prefix emu/viewer_src
      - name: Build the *real* 3D viewer with the new terrain option
        run: npm run build --prefix emu/viewer_src
      - name: Confirm REAL browser nine-solid-box XML loads and mocap tiles physically move
        run: |
          node --input-type=module - <<'JS' > /tmp/emu-carpet.xml
          import fs from 'node:fs';
          import {createSolidCarpet} from './emu/viewer_src/src/training-solid-carpet.js';
          import {withTerrain} from './emu/viewer_src/src/terrain.js';
          const robot=fs.readFileSync('emu/robot.xml','utf8');
          const carpet=createSolidCarpet(
            {seed:735,slopeDeg:8,transitionDeg:3,stepUpM:.02,stepDownM:.03},'step');
          process.stdout.write(withTerrain(robot,'carpet',{park:carpet}));
          JS
          python - <<'PY'
          import mujoco
          import numpy as np
          model=mujoco.MjModel.from_xml_path('/tmp/emu-carpet.xml')
          assert model.nhfield==0, 'Legacy heightfield unexpectedly remains'
          assert model.nmocap==9, 'Rolling browser carpet needs nine moving bodies'
          geom_ids=[]
          for i in range(9):
              gid=mujoco.mj_name2id(model,mujoco.mjtObj.mjOBJ_GEOM,
                                   f'viewer_carpet_solid_{i}')
              bid=mujoco.mj_name2id(model,mujoco.mjtObj.mjOBJ_BODY,
                                   f'viewer_carpet_body_{i}')
              assert gid>=0 and bid>=0
              assert model.geom_type[gid]==mujoco.mjtGeom.mjGEOM_BOX
              np.testing.assert_allclose(model.geom_size[gid], [.258,.258,.270])
              assert model.body_mocapid[bid]>=0
              geom_ids.append(gid)
          data=mujoco.MjData(model)
          mujoco.mj_forward(model,data)
          assert np.isfinite(data.qpos).all()
          before=data.geom_xpos[geom_ids[0]].copy()
          mid=int(model.body_mocapid[model.geom_bodyid[geom_ids[0]]])
          data.mocap_pos[mid,0]+=.5
          mujoco.mj_forward(model,data)
          assert np.isclose(data.geom_xpos[geom_ids[0],0]-before[0],.5,atol=1e-6)
          print('Real MuJoCo nine solid boxes and moving contact bodies: PASS')
          PY
