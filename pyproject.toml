[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emu-biped"
version = "5013.0.0"
description = "Self-mapping reinforcement-learning trainer for a dynamically unstable six-actuator biped"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26,<3",
  "optax>=0.2.5,<1",
  "mujoco>=3.2,<4",
  "mujoco-mjx>=3.2,<4",
]

[project.scripts]
emu = "emu.cli:main"

[tool.setuptools.packages.find]
include = ["emu*"]

[tool.setuptools.package-data]
emu = ["VERSION", "robot.xml"]
